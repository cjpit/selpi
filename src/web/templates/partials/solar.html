<div class="grid">

  </div>
  <div class="card">
    <div class="card-title">Solar Output %</div>
    <div class="card-value">{{ snapshot.solar.percent }}%</div>

  </div>
  <div class="card">

  </div>
  <div class="card">
    <div class="card-title">Kaco 5</div>

  </div>
