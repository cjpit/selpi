{% set f = snapshot.flow %}
{# Determine battery colour from SOC #}
{% if f.soc_color == 'red' %}
  {% set batt_color = 'var(--danger)' %}
{% elif f.soc_color == 'orange' %}
  {% set batt_color = 'var(--warning)' %}
{% else %}
  {% set batt_color = 'var(--success)' %}
{% endif %}
<div class="energy-flow-container">
  <svg class="energy-flow" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sun icon (24x24) -->
      <g id="icon-sun">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- Generator icon (24x24) -->
      <g id="icon-generator">
        <rect x="3" y="8" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M7 8V5h3M17 8V4h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 13.5h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="13.5" r="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M6 19v2M18 19v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- Battery charging bolt -->
      <g id="icon-bolt">
        <path d="M12 5l-3 7h4l-3 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- House icon (24x24) -->
      <g id="icon-house">
        <path d="M3 12l9-8 9 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 12v8a1 1 0 001 1h12a1 1 0 001-1v-8" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 21v-6a1 1 0 011-1h4a1 1 0 011 1v6" fill="none" stroke="currentColor" stroke-width="2"/>
      </g>
      <!-- Battery fill clip path (matches interior of battery body) -->
      <clipPath id="battery-clip">
        <rect x="374" y="489" width="152" height="52" rx="8"/>
      </clipPath>
    </defs>

    <!-- ===== AC BUS BAR (horizontal structural line) ===== -->
    <line x1="200" y1="280" x2="800" y2="280"
          stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
    <!-- Bus junction dots — SP PRO junction, ABB junction, House junction -->
    <circle cx="300" cy="280" r="5" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="450" cy="280" r="5" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="700" cy="280" r="5" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>


    <!-- ===== CONNECTION PATHS (background lines) ===== -->

    <!-- Solar → ABB Inverter (vertical, short) -->
    <path class="flow-line {% if f.solar_active %}active{% else %}inactive{% endif %}"
          style="{% if f.solar_active %}stroke: var(--flow-solar);{% endif %}"
          d="M450 77 C450 85, 450 92, 450 100"
          fill="none" stroke-width="3" stroke-linecap="round"/>

    <!-- ABB Inverter → AC Bus (vertical) -->
    <path class="flow-line {% if f.solar_active %}active{% else %}inactive{% endif %}"
          style="{% if f.solar_active %}stroke: var(--flow-solar);{% endif %}"
          d="M450 175 C450 205, 450 245, 450 280"
          fill="none" stroke-width="3" stroke-linecap="round"/>

    <!-- AC Bus → SP PRO (vertical, down at x=300) -->
    <path class="flow-line {% if f.battery_active %}active{% else %}inactive{% endif %}"
          style="{% if f.battery_active %}stroke: {% if f.battery_charging %}var(--flow-battery-in){% else %}var(--flow-battery-out){% endif %};{% endif %}"
          d="M300 280 C300 305, 300 332, 300 360"
          fill="none" stroke-width="3" stroke-linecap="round"/>

    <!-- AC Bus → House (vertical, down at x=700) -->
    <path class="flow-line {% if f.load_active %}active{% else %}inactive{% endif %}"
          style="{% if f.load_active %}stroke: var(--flow-house);{% endif %}"
          d="M700 280 C700 305, 700 332, 700 360"
          fill="none" stroke-width="3" stroke-linecap="round"/>

    <!-- SP PRO → Battery (rightward then down to battery) -->
    <path class="flow-line {% if f.battery_active %}active{% else %}inactive{% endif %}"
          style="{% if f.battery_active %}stroke: {% if f.battery_charging %}var(--flow-battery-in){% else %}var(--flow-battery-out){% endif %};{% endif %}"
          d="M340 420 C380 420, 400 445, 450 485"
          fill="none" stroke-width="3" stroke-linecap="round"/>

    <!-- Generator → SP PRO (horizontal) -->
    <path class="flow-line {% if f.generator_active %}active{% else %}inactive{% endif %}"
          style="{% if f.generator_active %}stroke: var(--flow-generator);{% endif %}"
          d="M160 390 C200 390, 250 390, 270 390"
          fill="none" stroke-width="3" stroke-linecap="round"/>


    <!-- ===== INVERTER FREQUENCY (above Bus → House line) ===== -->
    <text x="715" y="272" fill="var(--muted)" font-size="10" font-weight="400">
      {{ f.inv_freq_hz }} Hz
    </text>


    <!-- ===== HORIZONTAL BUS FLOW DOTS ===== -->

    <!-- Solar → House on bus (rightward from ABB junction) -->
    {% if f.solar_active and f.load_active %}
    <circle r="4" fill="var(--flow-solar)" opacity="0.9">
      <animateMotion dur="{{ f.solar_speed }}" repeatCount="indefinite"
                     path="M450 280 C525 280, 625 280, 700 280"/>
    </circle>
    <circle r="4" fill="var(--flow-solar)" opacity="0.6">
      <animateMotion dur="{{ f.solar_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M450 280 C525 280, 625 280, 700 280"/>
    </circle>
    <circle r="4" fill="var(--flow-solar)" opacity="0.35">
      <animateMotion dur="{{ f.solar_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M450 280 C525 280, 625 280, 700 280"/>
    </circle>
    {% endif %}

    <!-- Solar → SP PRO on bus (leftward from ABB junction to SP PRO, for charging) -->
    {% if f.solar_active and f.battery_charging %}
    <circle r="4" fill="var(--flow-battery-in)" opacity="0.9">
      <animateMotion dur="{{ f.battery_speed }}" repeatCount="indefinite"
                     path="M450 280 C412 280, 338 280, 300 280"/>
    </circle>
    <circle r="4" fill="var(--flow-battery-in)" opacity="0.6">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M450 280 C412 280, 338 280, 300 280"/>
    </circle>
    <circle r="4" fill="var(--flow-battery-in)" opacity="0.35">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M450 280 C412 280, 338 280, 300 280"/>
    </circle>
    {% endif %}

    <!-- SP PRO → House on bus (rightward from SP PRO junction, for discharging) -->
    {% if f.battery_discharging %}
    <circle r="4" fill="var(--flow-battery-out)" opacity="0.9">
      <animateMotion dur="{{ f.battery_speed }}" repeatCount="indefinite"
                     path="M300 280 C400 280, 550 280, 700 280"/>
    </circle>
    <circle r="4" fill="var(--flow-battery-out)" opacity="0.6">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M300 280 C400 280, 550 280, 700 280"/>
    </circle>
    <circle r="4" fill="var(--flow-battery-out)" opacity="0.35">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M300 280 C400 280, 550 280, 700 280"/>
    </circle>
    {% endif %}


    <!-- ===== VERTICAL FLOW DOTS ===== -->

    <!-- Solar → ABB dots -->
    {% if f.solar_active %}
    <circle r="5" fill="var(--flow-solar)" opacity="0.9">
      <animateMotion dur="{{ f.solar_speed }}" repeatCount="indefinite"
                     path="M450 77 C450 85, 450 92, 450 100"/>
    </circle>
    <circle r="5" fill="var(--flow-solar)" opacity="0.6">
      <animateMotion dur="{{ f.solar_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M450 77 C450 85, 450 92, 450 100"/>
    </circle>
    <circle r="5" fill="var(--flow-solar)" opacity="0.35">
      <animateMotion dur="{{ f.solar_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M450 77 C450 85, 450 92, 450 100"/>
    </circle>
    {% endif %}

    <!-- ABB → Bus dots -->
    {% if f.solar_active %}
    <circle r="5" fill="var(--flow-solar)" opacity="0.9">
      <animateMotion dur="{{ f.solar_speed }}" repeatCount="indefinite"
                     path="M450 175 C450 205, 450 245, 450 280"/>
    </circle>
    <circle r="5" fill="var(--flow-solar)" opacity="0.6">
      <animateMotion dur="{{ f.solar_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M450 175 C450 205, 450 245, 450 280"/>
    </circle>
    <circle r="5" fill="var(--flow-solar)" opacity="0.35">
      <animateMotion dur="{{ f.solar_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M450 175 C450 205, 450 245, 450 280"/>
    </circle>
    {% endif %}

    <!-- Bus → SP PRO dots (charging: downward) -->
    {% if f.battery_charging %}
    <circle r="5" fill="var(--flow-battery-in)" opacity="0.9">
      <animateMotion dur="{{ f.battery_speed }}" repeatCount="indefinite"
                     path="M300 280 C300 305, 300 332, 300 360"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-in)" opacity="0.6">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M300 280 C300 305, 300 332, 300 360"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-in)" opacity="0.35">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M300 280 C300 305, 300 332, 300 360"/>
    </circle>
    {% endif %}

    <!-- SP PRO → Bus dots (discharging: upward) -->
    {% if f.battery_discharging %}
    <circle r="5" fill="var(--flow-battery-out)" opacity="0.9">
      <animateMotion dur="{{ f.battery_speed }}" repeatCount="indefinite"
                     path="M300 360 C300 332, 300 305, 300 280"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-out)" opacity="0.6">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M300 360 C300 332, 300 305, 300 280"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-out)" opacity="0.35">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M300 360 C300 332, 300 305, 300 280"/>
    </circle>
    {% endif %}

    <!-- SP PRO → Battery dots (charging: rightward then down to battery) -->
    {% if f.battery_charging %}
    <circle r="5" fill="var(--flow-battery-in)" opacity="0.9">
      <animateMotion dur="{{ f.battery_speed }}" repeatCount="indefinite"
                     path="M340 420 C380 420, 400 445, 450 485"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-in)" opacity="0.6">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M340 420 C380 420, 400 445, 450 485"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-in)" opacity="0.35">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M340 420 C380 420, 400 445, 450 485"/>
    </circle>
    {% endif %}

    <!-- Battery → SP PRO dots (discharging: from battery up then left to SP PRO) -->
    {% if f.battery_discharging %}
    <circle r="5" fill="var(--flow-battery-out)" opacity="0.9">
      <animateMotion dur="{{ f.battery_speed }}" repeatCount="indefinite"
                     path="M450 485 C400 445, 400 420, 340 420"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-out)" opacity="0.6">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M450 485 C400 445, 400 420, 340 420"/>
    </circle>
    <circle r="5" fill="var(--flow-battery-out)" opacity="0.35">
      <animateMotion dur="{{ f.battery_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M450 485 C400 445, 400 420, 340 420"/>
    </circle>
    {% endif %}

    <!-- Bus → House dots (downward) -->
    {% if f.load_active %}
    <circle r="5" fill="var(--flow-house)" opacity="0.9">
      <animateMotion dur="{{ f.load_speed }}" repeatCount="indefinite"
                     path="M700 280 C700 305, 700 332, 700 360"/>
    </circle>
    <circle r="5" fill="var(--flow-house)" opacity="0.6">
      <animateMotion dur="{{ f.load_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M700 280 C700 305, 700 332, 700 360"/>
    </circle>
    <circle r="5" fill="var(--flow-house)" opacity="0.35">
      <animateMotion dur="{{ f.load_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M700 280 C700 305, 700 332, 700 360"/>
    </circle>
    {% endif %}

    <!-- Generator → SP PRO dots -->
    {% if f.generator_active %}
    <circle r="5" fill="var(--flow-generator)" opacity="0.9">
      <animateMotion dur="{{ f.generator_speed }}" repeatCount="indefinite"
                     path="M160 390 C200 390, 250 390, 270 390"/>
    </circle>
    <circle r="5" fill="var(--flow-generator)" opacity="0.6">
      <animateMotion dur="{{ f.generator_speed }}" begin="-0.33s" repeatCount="indefinite"
                     path="M160 390 C200 390, 250 390, 270 390"/>
    </circle>
    <circle r="5" fill="var(--flow-generator)" opacity="0.35">
      <animateMotion dur="{{ f.generator_speed }}" begin="-0.66s" repeatCount="indefinite"
                     path="M160 390 C200 390, 250 390, 270 390"/>
    </circle>
    {% endif %}


    <!-- ===== NODE CARDS ===== -->

    <!-- ===== Solar Node (top center, on x=450) ===== -->
    <g class="flow-node {% if f.solar_active %}active{% else %}inactive{% endif %}" data-source="solar">
      <rect x="380" y="15" width="140" height="62" rx="10"
            fill="var(--surface)"
            stroke="{% if f.solar_active %}var(--flow-solar){% else %}var(--flow-inactive){% endif %}"
            stroke-width="1.5"/>
      <!-- Icon: Sun -->
      <g transform="translate(390, 23) scale(0.85)"
         style="color: {% if f.solar_active %}var(--flow-solar){% else %}var(--flow-inactive){% endif %}">
        <use href="#icon-sun"/>
      </g>
      <text x="422" y="40" fill="{% if f.solar_active %}var(--flow-solar){% else %}var(--flow-inactive){% endif %}"
            font-size="12" font-weight="600">Solar</text>
      <!-- Power value -->
      <text x="450" y="66" fill="var(--text)" font-size="18" font-weight="700" text-anchor="middle">
        {{ f.solar_w }}<tspan fill="var(--muted)" font-size="12" font-weight="400"> W</tspan>
      </text>
    </g>

    <!-- ===== ABB Inverter Node (same width as Solar, centered on x=450) ===== -->
    <g class="flow-node {% if f.abb_active %}active{% else %}inactive{% endif %}" data-source="abb">
      <rect x="380" y="100" width="140" height="75" rx="10"
            fill="var(--surface)"
            stroke="{% if f.abb_active %}var(--flow-solar){% else %}var(--flow-inactive){% endif %}"
            stroke-width="1.5"/>
      <!-- ABB logo -->
      <image href="/static/img/abb-logo.svg"
             x="388" y="106" width="32" height="12"
             preserveAspectRatio="xMidYMid meet"/>
      <!-- Inverter label -->
      <text x="425" y="117" fill="{% if f.abb_active %}var(--flow-solar){% else %}var(--flow-inactive){% endif %}"
            font-size="11" font-weight="600">Inverter</text>
      <!-- Power value -->
      <text x="450" y="138" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">
        {{ f.abb_power_w }}<tspan fill="var(--muted)" font-size="10" font-weight="400"> W</tspan>
      </text>
      <!-- Progress bar background -->
      <rect x="388" y="148" width="124" height="8" rx="4" fill="var(--border)"/>
      <!-- Progress bar fill -->
      <rect x="388" y="148" width="{{ (124 * f.abb_percent / 100) | round(1) }}" height="8" rx="4"
            fill="{% if f.abb_active %}var(--flow-solar){% else %}var(--flow-inactive){% endif %}"/>
      <!-- Capacity text -->
      <text x="450" y="170" text-anchor="middle" fill="var(--muted)" font-size="9">
        {{ f.abb_percent }}% of {{ f.abb_max_w // 1000 }} kW
      </text>
    </g>

    <!-- ===== Generator Node (far left, at same y as SP PRO) ===== -->
    <g class="flow-node {% if f.generator_active %}active{% else %}inactive{% endif %}" data-source="generator">
      <rect x="40" y="360" width="120" height="60" rx="10"
            fill="var(--surface)"
            stroke="{% if f.generator_active %}var(--flow-generator){% else %}var(--flow-inactive){% endif %}"
            stroke-width="1.5"/>
      <!-- Icon: Generator -->
      <g transform="translate(50, 368) scale(0.8)"
         style="color: {% if f.generator_active %}var(--flow-generator){% else %}var(--flow-inactive){% endif %}">
        <use href="#icon-generator"/>
      </g>
      <text x="88" y="386" fill="{% if f.generator_active %}var(--flow-generator){% else %}var(--flow-inactive){% endif %}"
            font-size="11" font-weight="600">Generator</text>
      <!-- Power value -->
      <text x="100" y="410" fill="var(--text)" font-size="16" font-weight="700" text-anchor="middle">
        {{ f.generator_w }}<tspan fill="var(--muted)" font-size="11" font-weight="400"> W</tspan>
      </text>
    </g>

    <!-- ===== SP PRO Hub (positioned at x=300, below bus junction) ===== -->
    <g class="flow-hub">
      <rect x="230" y="360" width="140" height="60" rx="12"
            fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
      <!-- Selectronic logo -->
      <image href="/static/img/selectronic-logo.svg"
             x="242" y="370" width="116" height="20"
             preserveAspectRatio="xMidYMid meet"/>
      <!-- SP PRO label -->
      <text x="300" y="408" fill="var(--muted)" font-size="10" text-anchor="middle" font-weight="500">SP PRO</text>
    </g>

    <!-- ===== Battery Node (centered on x=450, below ABB Inverter column) ===== -->
    <g class="flow-node {% if f.battery_active %}active{% else %}inactive{% endif %}" data-source="battery">
      <!-- Battery outer body -->
      <rect x="370" y="485" width="160" height="60" rx="10"
            fill="var(--surface)"
            stroke="{% if f.battery_active %}{{ batt_color }}{% else %}var(--flow-inactive){% endif %}"
            stroke-width="2"/>
      <!-- Battery terminal (right bump) -->
      <rect x="530" y="503" width="12" height="24" rx="3"
            fill="var(--surface)"
            stroke="{% if f.battery_active %}{{ batt_color }}{% else %}var(--flow-inactive){% endif %}"
            stroke-width="1.5"/>
      <!-- SOC fill bar (clipped to battery interior) -->
      <rect x="374" y="489" width="{{ (152 * f.soc_pct / 100) | round(1) }}" height="52" rx="8"
            fill="{{ batt_color }}" opacity="0.25"
            clip-path="url(#battery-clip)"/>
      <!-- Charging bolt overlay -->
      {% if f.battery_charging %}
      <g transform="translate(394, 495) scale(0.7)" style="color: {{ batt_color }}">
        <use href="#icon-bolt"/>
      </g>
      {% endif %}
      <!-- SOC percentage (large, centered in battery body) -->
      <text x="450" y="522" text-anchor="middle"
            fill="{{ batt_color }}" font-size="22" font-weight="700">
        {{ f.soc_pct }}%
      </text>
      <!-- Charge state label — larger and bold -->
      <text x="450" y="562" text-anchor="middle"
            fill="{{ batt_color }}" font-size="16" font-weight="700">
        {{ f.charge_state }}
      </text>
      <!-- Hours remaining -->
      <text x="450" y="582" text-anchor="middle"
            fill="var(--muted)" font-size="11">
        {{ f.hours_remaining }} h remaining
      </text>
      <!-- Power value -->
      <text x="450" y="598" text-anchor="middle"
            fill="var(--text)" font-size="16" font-weight="700">
        {{ f.battery_w }}<tspan fill="var(--muted)" font-size="11" font-weight="400"> W</tspan>
      </text>
    </g>

    <!-- ===== House Node (right side at x=700, below bus junction) ===== -->
    <g class="flow-node {% if f.load_active %}active{% else %}inactive{% endif %}" data-source="house">
      <rect x="640" y="360" width="120" height="60" rx="10"
            fill="var(--surface)"
            stroke="{% if f.load_active %}var(--flow-house){% else %}var(--flow-inactive){% endif %}"
            stroke-width="1.5"/>
      <!-- Icon: House -->
      <g transform="translate(650, 368) scale(0.8)"
         style="color: {% if f.load_active %}var(--flow-house){% else %}var(--flow-inactive){% endif %}">
        <use href="#icon-house"/>
      </g>
      <text x="690" y="386" fill="{% if f.load_active %}var(--flow-house){% else %}var(--flow-inactive){% endif %}"
            font-size="11" font-weight="600">House</text>
      <!-- Power value -->
      <text x="700" y="410" fill="var(--text)" font-size="16" font-weight="700" text-anchor="middle">
        {{ f.load_w }}<tspan fill="var(--muted)" font-size="11" font-weight="400"> W</tspan>
      </text>
    </g>

  </svg>
</div>
