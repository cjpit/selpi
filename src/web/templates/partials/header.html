<span data-text="$connected ? 'Connected' : 'Disconnected'"
      data-class:status-connected="$connected"
      data-class:status-disconnected="!$connected"></span>
<span>{{ snapshot.meta.last_updated or '--' }}</span>
{% if snapshot.meta.error %}
<span class="status-error">Error: {{ snapshot.meta.error }}</span>
{% endif %}
