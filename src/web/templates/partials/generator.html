<div class="grid">
  <div class="card">
    <div class="card-title">Status</div>
    <div class="card-value">{{ snapshot.generator.status }}</div>
  </div>
  <div class="card">
    <div class="card-title">Start Reason</div>
    <div class="card-value">{{ snapshot.generator.start_reason }}</div>
  </div>
  <div class="card">
    <div class="card-title">Running Reason</div>
    <div class="card-value">{{ snapshot.generator.running_reason }}</div>
  </div>
  <div class="card">
    <div class="card-title">AC Input Today</div>
    <div class="card-value">{{ snapshot.generator.ac_today_kwh }} kWh</div>
  </div>
  <div class="card">
    <div class="card-title">AC Input Yesterday</div>
    <div class="card-value">{{ snapshot.generator.ac_yesterday_kwh }} kWh</div>
  </div>
  <div class="card" id="generator-control">
    <div class="card-title">Control</div>
    <div id="generator-status"></div>
    <div class="button-group">
      <button
        data-on:click="@post('/api/generator/start')"
        data-indicator="generator-busy"
        data-attr:disabled="$generator_busy"
        class="btn btn-start"
      >Start</button>
      <button
        data-on:click="@post('/api/generator/stop')"
        data-indicator="generator-busy"
        data-attr:disabled="$generator_busy"
        class="btn btn-stop"
      >Stop</button>
    </div>
  </div>
</div>
