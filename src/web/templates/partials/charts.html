<div class="charts-header">
  <h2>Charts</h2>
  <div class="chart-controls">
    <button class="chart-range-btn active" data-range="1h">1h</button>
    <button class="chart-range-btn" data-range="6h">6h</button>
    <button class="chart-range-btn" data-range="24h">24h</button>
    <button class="chart-range-btn" data-range="7d">7d</button>
    <button class="chart-range-btn" data-range="30d">30d</button>
    <button class="chart-range-btn" data-range="1y">1y</button>
  </div>
</div>

<div class="charts-grid">
  <div class="chart-container">
    <div class="chart-title">Power (W)</div>
    <div id="chart-group-power" class="chart-area">
      <div class="chart-empty">Loading...</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Battery</div>
    <div id="chart-group-battery" class="chart-area">
      <div class="chart-empty">Loading...</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Energy Today (Wh)</div>
    <div id="chart-group-energy" class="chart-area">
      <div class="chart-empty">Loading...</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Solar</div>
    <div id="chart-group-solar" class="chart-area">
      <div class="chart-empty">Loading...</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Temperatures (°C)</div>
    <div id="chart-group-temps" class="chart-area">
      <div class="chart-empty">Loading...</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Generator</div>
    <div id="chart-group-generator" class="chart-area">
      <div class="chart-empty">Loading...</div>
    </div>
  </div>
</div>
