<div class="grid">
  <div class="card">
    <div class="card-title">State of Charge</div>
    <div class="card-value">{{ snapshot.overview.soc }}%</div>
  </div>
  <div class="card">
    <div class="card-title">Hours Remaining</div>
    <div class="card-value">{{ snapshot.overview.hours_remaining }} h</div>
  </div>
  <div class="card">
    <div class="card-title">Solar Output</div>
    <div class="card-value">{{ snapshot.overview.solar_w }} W</div>
  </div>
  <div class="card">
    <div class="card-title">Load</div>
    <div class="card-value">{{ snapshot.overview.load_w }} W</div>
  </div>
  <div class="card">
    <div class="card-title">Battery Power</div>
    <div class="card-value">{{ snapshot.overview.battery_w }} W</div>
  </div>
  <div class="card">
    <div class="card-title">Charge State</div>
    <div class="card-value">{{ snapshot.overview.battery_state }}</div>
  </div>
</div>
